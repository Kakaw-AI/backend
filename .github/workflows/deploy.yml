name: Deploy

# Runs after CI has pushed the new image to GHCR, and asks Dokploy to pull it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  dokploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$DOKPLOY_WEBHOOK_URL"
